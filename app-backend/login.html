<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f3f5f0"><title>Sign in · Calma</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f3f5f0;color:#193a2f;font:15px system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px}.shell{width:min(100%,420px)}.brand{font-size:24px;font-weight:800;letter-spacing:-1px;display:flex;gap:10px;align-items:center;margin-bottom:32px}.mark{width:34px;height:34px;border-radius:10px;background:#285b43;color:#daefa9;display:grid;place-items:center}.card{background:#fff;border:1px solid #e3e9e2;border-radius:18px;padding:28px;box-shadow:0 20px 50px #193a2f0a}h1{font-size:23px;letter-spacing:-.5px;margin:0 0 7px}.sub{color:#75847a;font-size:13px;line-height:1.6;margin:0 0 23px}.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:12px;font-weight:650}.field input,.field select{width:100%;border:1px solid #dfe7de;border-radius:9px;padding:12px;font:inherit;color:#193a2f;outline:none}.field input:focus,.field select:focus{border-color:#477756;box-shadow:0 0 0 3px #47775618}.btn{width:100%;border:0;border-radius:9px;background:#285b43;color:#fff;font-weight:700;padding:13px;margin-top:8px;cursor:pointer}.btn:disabled{opacity:.55;cursor:wait}.switch{display:block;border:0;background:none;color:#285b43;font:inherit;font-size:13px;font-weight:700;cursor:pointer;padding:14px 0 0}.message{font-size:12px;line-height:1.5;color:#a34e3c;min-height:18px;margin:11px 0 0}.foot{font-size:11px;color:#75847a;line-height:1.6;margin:18px 3px}.foot a{color:#285b43;font-weight:700}.hide{display:none!important}
</style></head>
<body><main class="shell"><div class="brand"><span class="mark">C</span>Calma</div><section class="card"><h1 id="heading">Welcome back</h1><p class="sub" id="sub">Sign in to your business workspace.</p><form id="form"><div class="field hide" id="workspaceField"><label for="workspace">Business workspace</label><input id="workspace" autocomplete="organization" maxlength="120" placeholder="Your business name"></div><div class="field hide" id="googleWorkspaceField"><label for="googleWorkspace">Choose workspace</label><select id="googleWorkspace" required></select></div><div class="field hide" id="passwordWorkspaceField"><label for="passwordWorkspace">Choose workspace</label><select id="passwordWorkspace"></select></div><div class="field" id="emailField"><label for="email">Work email</label><input id="email" type="email" autocomplete="email" required maxlength="254"></div><div class="field hide" id="resetTokenField"><label for="resetToken">Reset token</label><input id="resetToken" autocomplete="off"></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required minlength="12" maxlength="256"></div><button class="btn" id="submit" type="submit">Sign in</button><p class="message" id="message" role="status"></p></form><button class="switch" id="forgot" type="button">Forgot password?</button><button class="switch" id="google" type="button">Continue with Google</button><button class="switch" id="toggle" type="button">Create a new workspace</button><p class="foot hide" id="authSetup" role="status"></p></section><p class="foot">Business Owner creates a workspace. Admin manages customer work and teammates. Employee has read-only access.</p></main>
<script>
const $=s=>document.querySelector(s);let registering=false,invitation=null,resetting=false,choosingGoogle=false;const params=new URLSearchParams(location.search),next=params.get('next'),inviteToken=params.get('invite'),resetToken=params.get('reset'),googleTicket=params.get('google_ticket');function draw(){ $('#heading').textContent=choosingGoogle?'Choose workspace':resetting?'Reset password':invitation?'Join '+invitation.workspace_name:registering?'Create your workspace':'Welcome back';$('#sub').textContent=choosingGoogle?'Select the business workspace to open.':resetting?'Choose a new password of at least 12 characters.':invitation?'Create your account as '+invitation.role+'.':registering?'Create a Business Owner account.':'Sign in to your business workspace.';$('#workspaceField').classList.toggle('hide',!registering||!!invitation);$('#googleWorkspaceField').classList.toggle('hide',!choosingGoogle);$('#googleWorkspace').required=choosingGoogle;$('#passwordWorkspaceField').classList.toggle('hide',registering||resetting||choosingGoogle||!$('#passwordWorkspace').options.length);$('#emailField').classList.toggle('hide',resetting||choosingGoogle);$('#resetTokenField').classList.toggle('hide',!resetting);$('#email').required=!resetting&&!choosingGoogle;$('#password').autocomplete=registering||resetting||invitation?'new-password':'current-password';$('#password').required=!choosingGoogle&&!params.has('forgot');$('#password').classList.toggle('hide',choosingGoogle);$('#submit').textContent=choosingGoogle?'Continue':resetting?'Reset password':invitation?'Accept invite':registering?'Create workspace':'Sign in';$('#toggle').classList.toggle('hide',!!invitation||resetting||choosingGoogle);$('#forgot').classList.toggle('hide',registering||!!invitation||resetting||choosingGoogle);$('#google').classList.toggle('hide',registering||!!invitation||resetting||choosingGoogle);if(invitation){$('#email').value=invitation.email;$('#email').readOnly=true}if(resetToken)$('#resetToken').value=resetToken}$('#toggle').onclick=()=>{registering=!registering;$('#message').textContent='';draw()};$('#forgot').onclick=async()=>{const email=$('#email').value.trim();if(!email){$('#email').focus();$('#message').textContent='Enter your account email first.';return}try{const r=await fetch('/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})}),j=await r.json();if(!r.ok)throw Error(j.error);$('#message').textContent=j.message}catch(e){$('#message').textContent=e.message}};$('#google').onclick=()=>location.assign('/api/auth/google');$('#form').onsubmit=async e=>{e.preventDefault();$('#message').textContent='';$('#submit').disabled=true;try{let endpoint,body={email:$('#email').value,password:$('#password').value,workspace_id:$('#passwordWorkspace').value};if(choosingGoogle){endpoint='/api/auth/google/select';body={ticket:googleTicket,workspace_id:$('#googleWorkspace').value}}else if(resetting){endpoint='/api/auth/reset-password';body={token:$('#resetToken').value,password:$('#password').value}}else if(invitation){endpoint='/api/auth/accept-invite';body={...body,token:inviteToken}}else if(registering){endpoint='/api/auth/register';body={...body,workspace_name:$('#workspace').value}}else endpoint='/api/auth/login';let r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),j=await r.json();if(r.status===409&&Array.isArray(j.workspaces)){const select=$('#passwordWorkspace');select.replaceChildren(new Option('Choose workspace',''),...j.workspaces.map(w=>new Option(w.name,w.id)));select.required=true;$('#passwordWorkspaceField').classList.remove('hide');$('#message').textContent=j.error||'Choose workspace';return}if(!r.ok)throw Error(j.error||'Sign in failed');if(resetting){location.replace('/login.html');return}location.replace(next&&next.startsWith('/')&&!next.startsWith('//')?next:'/')}catch(err){$('#message').textContent=err.message}finally{$('#submit').disabled=false}};const authError=params.get('auth_error');if(authError)$('#message').textContent=authError;if(googleTicket){choosingGoogle=true;draw();fetch('/api/auth/google/workspaces?ticket='+encodeURIComponent(googleTicket)).then(async r=>{const x=await r.json();if(!r.ok)throw Error(x.error);$('#googleWorkspace').innerHTML=x.workspaces.map(w=>'<option value="'+w.id+'">'+w.name.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))+'</option>').join('')||'<option value="">No linked workspaces</option>';}).catch(e=>$('#message').textContent=e.message)}else if(resetToken){resetting=true;draw()}else if(inviteToken)fetch('/api/auth/invite?token='+encodeURIComponent(inviteToken)).then(async r=>{const x=await r.json();if(!r.ok)throw Error(x.error);invitation=x;registering=true;draw()}).catch(e=>{$('#message').textContent=e.message});else fetch('/api/auth/status').then(r=>r.json()).then(x=>{if(x.setup_required){registering=true;draw()}if(!x.google_login)$('#google').classList.add('hide');const unavailable=[];if(!x.google_login)unavailable.push('Google login');if(!x.password_recovery)unavailable.push('password recovery email');$('#authSetup').classList.toggle('hide',!unavailable.length);$('#authSetup').textContent='Not configured: '+unavailable.join(', ')+'.'}).catch(()=>{});if(!resetting&&!inviteToken&&!googleTicket)fetch('/api/auth/me').then(r=>r.json()).then(x=>{if(x.authenticated)location.replace('/')}).catch(()=>{});draw();
</script><script>if(location.protocol==='file:'){const setup=document.querySelector('#authSetup');setup.classList.remove('hide');setup.innerHTML='This file cannot sign you in. Start Calma with <code>run.ps1</code>, then open <a href="http://127.0.0.1:4173/login.html">http://127.0.0.1:4173/login.html</a>.';['submit','forgot','google','toggle'].forEach(id=>document.querySelector('#'+id).disabled=true)}</script></body></html>
